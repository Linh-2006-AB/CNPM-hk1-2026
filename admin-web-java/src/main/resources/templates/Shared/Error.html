<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã xảy ra lỗi - VERSA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin-theme.css">
</head>
<body>
    <main class="content">
        <div class="card" style="max-width:760px;margin:8vh auto">
            <div class="empty-state">
                <i class="fa-solid fa-triangle-exclamation" style="color:var(--red)"></i>
                <h2>Không thể hoàn tất yêu cầu</h2>
                <p>Hệ thống đã ghi nhận lỗi. Hãy thử tải lại trang hoặc quay về Dashboard.</p>
                <code>Request ID: DEMO-REQUEST-ID</code>
                <div class="page-actions" style="margin-top:8px">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại
                    </button>
                    <a href="/Admin" class="btn btn-primary">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
