<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm chủ gian hàng - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto}.subtitle{color:#aab5c8}
.page-heading{margin-bottom:24px}
.card{border:1px solid #28334a;border-radius:16px;background:#141c2d;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;padding:28px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.form-group{margin:0}
.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:13px;font-weight:600}
.form-control{width:100%;padding:12px 16px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white;font-size:14px}
.form-control:focus{outline:none;border-color:#5b8cff}
select.form-control{cursor:pointer}
.validation-summary{background:rgba(69, 31, 42, 0.6);border:1px solid rgba(69, 31, 42, 0.9);color:#ffabb6;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:13px}
.validation-summary p{margin:0}
.form-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:14px}
.btn-primary{background:#5b8cff;color:white}
.btn-primary:hover{background:#4a7be8}
.btn-secondary{background:#29364c;color:white}
.btn-secondary:hover{background:#34445c}
@media (max-width:768px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<main class="wrap">
    <div class="page-heading">
        <h1 style="margin:0 0 8px; font-size:28px; font-weight:800;">Thêm chủ gian hàng</h1>
        <p class="subtitle" style="margin:0;">Tạo tài khoản Owner để chủ quán quản lý các điểm tham quan (POI) của mình.</p>
    </div>

    <div class="card">
        <form th:action="@{/admin/owners/create}" th:object="${ownerProfile}" method="post">
            <!-- CSRF Token cho Spring Security -->
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            
            <!-- Hiển thị lỗi tổng quan nếu có -->
            <div th:if="${#fields.hasGlobalErrors()}" class="validation-summary">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" th:field="*{username}" name="username" class="form-control" placeholder="Nhập tên đăng nhập..." required />
                </div>

                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" th:field="*{email}" name="email" class="form-control" placeholder="owner@example.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu *</label>
                    <input type="password" th:field="*{password}" name="password" class="form-control" value="owner123" placeholder="Mật khẩu mặc định" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Trạng thái *</label>
                    <select th:field="*{status}" name="status" class="form-control">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Locked">Locked</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Tên gian hàng *</label>
                    <input type="text" th:field="*{businessName}" name="businessName" class="form-control" placeholder="Ví dụ: Quán Cà Phê Phố Cổ" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Người đại diện</label>
                    <input type="text" th:field="*{representativeName}" name="representativeName" class="form-control" placeholder="Họ và tên người đại diện" />
                </div>

                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" name="phone" class="form-control" placeholder="0901234567" />
                </div>

                <div class="form-group">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" th:field="*{address}" name="address" class="form-control" placeholder="Địa chỉ gian hàng" />
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/owners}" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu tài khoản
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
