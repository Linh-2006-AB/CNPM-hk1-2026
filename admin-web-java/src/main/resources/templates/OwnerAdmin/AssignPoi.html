<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Gán POI cho ' + ${ownerProfile.businessName} + ' - VERSA Admin'">Gán POI cho chủ gian hàng - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto}.subtitle{color:#aab5c8}
.page-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.card{border:1px solid #28334a;border-radius:16px;background:#141c2d;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;margin-bottom:24px}
.card-header{padding:20px 24px;border-bottom:1px solid #28334a}
.card-title{margin:0;font-size:18px;font-weight:700;color:#edf2fa}
.card-body{padding:24px}
.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:13px;font-weight:600}
.form-control{width:100%;padding:12px 16px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white;font-size:14px}
.form-control:focus{outline:none;border-color:#5b8cff}
select.form-control{cursor:pointer}
.table-wrapper{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;margin-top:0;text-align:left}
.data-table th{padding:14px 16px;background:#0e1524;color:#d5deec;font-size:13px;border-bottom:1px solid #28334a}
.data-table td{padding:14px 16px;border-bottom:1px solid #28334a;font-size:14px;color:#edf2fa;vertical-align:middle}
.data-table tr:hover td{background:rgba(91, 140, 255, 0.03)}
.badge{display:inline-block;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600}
.badge.green{background:rgba(18, 60, 49, 0.6);color:#8df0c0;border:1px solid rgba(18, 60, 49, 0.9)}
.badge.yellow{background:rgba(64, 53, 20, 0.6);color:#fde047;border:1px solid rgba(64, 53, 20, 0.9)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:14px}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-primary{background:#5b8cff;color:white}
.btn-primary:hover{background:#4a7be8}
.btn-secondary{background:#29364c;color:white}
.btn-secondary:hover{background:#34445c}
.btn-danger{background:#451f2a;color:#ffabb6;border:1px solid rgba(244,63,94,0.3)}
.btn-danger:hover{background:#542533}
</style>
</head>
<body>

<main class="wrap">
    <div class="page-heading">
        <div>
            <h1 style="margin:0 0 8px; font-size:28px; font-weight:800;" th:text="'Gán POI cho ' + ${ownerProfile.businessName}">Gán POI cho chủ gian hàng</h1>
            <p class="subtitle" style="margin:0;">Chủ gian hàng chỉ quản lý được các Điểm tham quan (POI) đã được gán.</p>
        </div>
    </div>

    <!-- Form Gán POI -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa-solid fa-link" style="color:#5b8cff; margin-right:8px;"></i> Chọn và gán POI mới</div>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/owners/assign-poi/{id}(id=${ownerProfile.id})}" method="post" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div style="flex:1; min-width:280px;">
                    <label class="form-label">Chọn điểm tham quan (POI) *</label>
                    <select name="poiId" class="form-control" required>
                        <option value="">-- Chọn POI --</option>
                        <option th:each="poi : ${pois}" 
                                th:value="${poi.id}" 
                                th:text="'#' + ${poi.id} + ' - ' + 
                                    (poi.translations != null and not #lists.isEmpty(poi.translations) ? 
                                        (poi.translations.?[languageCode == 'vi'][0] != null ? poi.translations.?[languageCode == 'vi'][0].name : poi.translations[0].name) : 'POI #' + poi.id) + 
                                    (poi.ownerProfileId == ownerProfile.id ? ' (đang thuộc owner này)' : (poi.ownerProfileId != null ? ' (đã có owner)' : ''))">
                            POI Option
                        </option>
                    </select>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> Gán POI
                    </button>
                    <a th:href="@{/admin/owners}" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Danh sách POI đã gán -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><i class="fa-solid fa-list-check" style="color:#5b8cff; margin-right:8px;"></i> Danh sách POI đã gán cho chủ gian hàng này</div>
        </div>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>POI</th>
                        <th style="width: 150px;">Trạng thái</th>
                        <th style="text-align:center; width: 140px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="poi : ${pois}" th:if="${poi.ownerProfileId == ownerProfile.id}">
                        <td>
                            <strong style="color:#edf2fa; font-size:15px;" th:text="${poi.translations != null and not #lists.isEmpty(poi.translations) ? (poi.translations.?[languageCode == 'vi'][0] != null ? poi.translations.?[languageCode == 'vi'][0].name : poi.translations[0].name) : 'POI #' + poi.id}">POI Name</strong>
                            <br />
                            <small style="color:#aab5c8;" th:text="'#' + ${poi.id}">#1</small>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${poi.status == 'active'} ? ' green' : ' yellow'" th:text="${poi.status}">Status</span>
                        </td>
                        <td style="text-align:center;">
                            <form th:action="@{/admin/owners/remove-poi}" method="post" style="display:inline; margin:0;" onsubmit="return confirm('Bạn có chắc chắn muốn bỏ gán POI này khỏi chủ gian hàng?');">
                                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="id" th:value="${ownerProfile.id}" />
                                <input type="hidden" name="poiId" th:value="${poi.id}" />
                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="fa-solid fa-trash"></i> Bỏ gán
                                </button>
                            </form>
                        </td>
                    </tr>
                    <!-- Trường hợp chưa gán POI nào -->
                    <tr th:if="${#lists.isEmpty(pois.?[ownerProfileId == ownerProfile.id])}">
                        <td colspan="3" style="text-align:center; padding:32px; color:#aab5c8;">
                            Chủ gian hàng này chưa được gán POI nào.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
