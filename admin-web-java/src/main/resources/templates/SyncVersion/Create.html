<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đóng gói dữ liệu mới - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}
.wrap{max-width:850px;margin:auto}.subtitle{color:#aab5c8;line-height:1.6}.card{margin-top:24px;padding:28px;border:1px solid #28334a;border-radius:16px;background:#141c2d}
.card-header{border-bottom:1px solid #28334a;padding-bottom:16px;margin-bottom:22px}.card-header h2{font-size:19px;margin:0 0 8px}.card-header p{margin:0;color:#8d9ab0;font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr;gap:22px}.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px}.required{color:#ff8796}.input-wrap{position:relative}.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8d9ab0}.input-wrap.textarea-wrap i{top:16px;transform:none}
input,textarea{width:100%;padding:13px 14px 13px 40px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white;font:inherit;outline:none}input:focus,textarea:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.12)}textarea{resize:vertical;min-height:110px}.hint{display:block;margin-top:7px;color:#8d9ab0;font-size:12px}.divider{border:0;border-top:1px solid #28334a;margin:24px 0 20px}.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border:1px solid transparent;border-radius:9px;text-decoration:none;font-size:14px;font-weight:700;cursor:pointer}.btn-primary{background:#5b8cff;color:white}.btn-secondary{background:#202b40;color:#dce5f5;border-color:#344158}
@media(max-width:650px){body{padding:18px}.card{padding:20px}.actions{flex-direction:column-reverse}.btn{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<h1>Đóng gói dữ liệu mới</h1>
<p class="subtitle">Tạo một phiên bản dữ liệu offline mới nhất để các thiết bị di động có thể cập nhật.</p>
<section class="card">
<div class="card-header">
<h2><i class="fa-solid fa-box-archive" style="color:#5b8cff"></i> Thông tin phiên bản</h2>
<p>Cấu hình mã định danh và ghi chú cho gói dữ liệu.</p>
</div>
<form id="versionForm">
<div class="form-grid">
<div class="form-group">
<label for="versionNumber" class="form-label">Mã phiên bản <span class="required">*</span></label>
<div class="input-wrap"><i class="fa-solid fa-code-branch"></i><input id="versionNumber" name="versionNumber" type="text" placeholder="VD: v20261024.1" required></div>
<small class="hint">Nên đặt theo định dạng ngày tháng để dễ quản lý.</small>
</div>
<div class="form-group">
<label for="description" class="form-label">Ghi chú cập nhật</label>
<div class="input-wrap textarea-wrap"><i class="fa-solid fa-file-lines"></i><textarea id="description" name="description" rows="4" placeholder="Nhập tóm tắt những thay đổi dữ liệu trong phiên bản này..."></textarea></div>
</div>
</div>
<hr class="divider">
<div class="actions">
<a href="Index.html" class="btn btn-secondary">Hủy bỏ</a>
<button type="submit" class="btn btn-primary"><i class="fa-solid fa-cloud-arrow-up"></i> Đóng gói &amp; Phát hành</button>
</div>
</form>
</section>
</main>
<script>
document.getElementById('versionForm').addEventListener('submit', function(event){
 event.preventDefault();
 alert('Đây là giao diện HTML mẫu; cần kết nối Spring Boot để tạo và phát hành phiên bản.');
});
</script>
</body>
</html>
