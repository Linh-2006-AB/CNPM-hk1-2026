<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chỉnh sửa cấu hình - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0b1020;--card:#141c2d;--border:#28334a;--text:#edf2fa;--muted:#aab5c8;--accent:#5b8cff;--input:#0e1524;--danger:#ef5367}
*{box-sizing:border-box}body{margin:0;padding:36px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto}.subtitle,.page-subtitle{color:var(--muted)}.page-title{font-size:30px;font-weight:700;margin-bottom:8px}.page-subtitle{margin-bottom:24px}.card{padding:26px;border:1px solid var(--border);border-radius:16px;background:var(--card);height:100%}.card-header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}.card-title{font-size:19px;font-weight:700;margin:0 0 8px}.card-subtitle{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form-group.full{grid-column:1/-1}.form-label,label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px}.form-control{width:100%;padding:13px 14px;border:1px solid #344158;border-radius:10px;background:var(--input);color:white;font:inherit}.form-control::placeholder{color:#8794aa}.form-control:focus{outline:2px solid #5b8cff55;border-color:var(--accent)}textarea.form-control{resize:vertical}.hint,.small{display:block;margin-top:7px;color:#8d9ab0;font-size:12px}.actions,.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border:1px solid transparent;border-radius:9px;color:white;text-decoration:none;font-size:14px;cursor:pointer;font-weight:700}.btn-primary{background:var(--accent)}.btn-secondary{background:#273247;border-color:#3a4760}.btn-danger{background:#8d2f42}.btn-sm{padding:8px 10px;font-size:12px}.table-wrapper{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:13px;color:#d5deec}td{font-size:14px}code,.key{color:var(--accent);font-family:Consolas,monospace}.row-actions{display:flex;gap:8px;justify-content:flex-end}.empty-state{text-align:center;padding:38px 16px;color:var(--muted)}.quick-fields{display:grid;gap:18px}.input-wrap{position:relative}.input-wrap .form-control{padding-left:40px}.input-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.note{padding:12px;border-radius:9px;background:#172641;color:#c8d8f7;font-size:13px;margin:12px 0}.pagination{display:flex;gap:6px;justify-content:flex-end;list-style:none;padding:0;margin:0}.pagination a{display:block;padding:8px 11px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);text-decoration:none}.pagination .active a{background:var(--accent);border-color:var(--accent)}@media(max-width:800px){body{padding:18px}.col-4,.col-5,.col-7,.col-8{grid-column:span 12}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.page-title{font-size:25px}}
</style>
</head>
<body><main class="wrap">
<div class="page-title">Chỉnh sửa cấu hình</div><div class="page-subtitle">Cập nhật cặp khóa và giá trị được dùng bởi hệ thống.</div>
<div class="layout"><section class="col-8"><div class="card">
<div class="card-header"><h2 class="card-title"><i class="fa-solid fa-sliders" style="color:var(--accent)"></i> Thông số hệ thống</h2><div class="card-subtitle">Thay đổi có hiệu lực ngay sau khi lưu.</div></div>
<form action="#" method="post" onsubmit="event.preventDefault();alert('Đây là giao diện HTML mẫu. Cần kết nối backend để lưu dữ liệu.');">
<input type="hidden" name="Id" value="1">
<div class="form-grid">
<div class="form-group"><label for="SettingKey">Khóa cấu hình</label><input id="SettingKey" name="SettingKey" class="form-control" value="offline_package_enabled" required></div>
<div class="form-group"><label for="SettingValue">Giá trị</label><input id="SettingValue" name="SettingValue" class="form-control" value="true" required></div>
<div class="form-group full"><label for="Description">Mô tả</label><textarea id="Description" name="Description" class="form-control" rows="4">Bật hoặc tắt chức năng tải gói dữ liệu ngoại tuyến.</textarea></div>
</div><div class="form-actions"><a href="Index.html" class="btn btn-secondary">Hủy</a><button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi</button></div>
</form></div></section></div></main></body></html>
