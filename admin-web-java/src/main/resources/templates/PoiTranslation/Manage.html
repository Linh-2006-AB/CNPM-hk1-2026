<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý bản dịch POI</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>:root{--bg:#0b1020;--surface:#141c2d;--surface2:#0e1524;--text:#edf2fa;--muted:#aab5c8;--border:#28334a;--accent:#5b8cff;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto}.heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.title{font-size:28px;font-weight:800}.muted{color:var(--muted);margin-top:7px}.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;font-weight:700;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{background:#8f2535;color:#fff}.card{margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:160px 1fr 1fr;gap:10px}.grid input,.grid textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:#fff}.grid textarea{min-height:90px}.wide{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{margin-top:12px;color:#86efac}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.table{min-width:800px}.card{overflow:auto}}</style></head><body><main class="wrap"><div class="heading"><div><div class="title">Bản dịch POI #<span th:text="${poi.id}">1</span></div><div class="muted" th:text="${poi.name}">Tên POI</div></div><a href="/admin/pois" class="btn"><i class="fa-solid fa-arrow-left"></i> Quay lại POI</a></div><section class="card"><h3>Thêm / cập nhật bản dịch</h3><form id="translationForm"><div class="grid"><input id="languageCode" maxlength="10" placeholder="vi / en / zh" required><input id="name" placeholder="Tên POI" required><input id="audioUrl" placeholder="Audio URL (tuỳ chọn)"><textarea id="shortDescription" placeholder="Mô tả ngắn"></textarea><textarea id="fullDescription" class="wide" placeholder="Mô tả đầy đủ"></textarea><textarea id="ttsScript" class="wide" placeholder="Nội dung thuyết minh TTS"></textarea><input id="videoUrl" class="wide" placeholder="Video URL (tuỳ chọn)"></div><p><button class="btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Lưu bản dịch</button></p><div id="msg" class="msg"></div></form></section><section class="card"><h3>Các ngôn ngữ hiện có</h3><table class="table"><thead><tr><th>Ngôn ngữ</th><th>Tên</th><th>Audio</th><th>Video</th><th>Thao tác</th></tr></thead><tbody><tr th:each="t : ${translations}"><td th:text="${t.languageCode}">vi</td><td th:text="${t.name}">Tên</td><td th:text="${t.audioUrl ?: '-'}">-</td><td th:text="${t.videoUrl ?: '-'}">-</td><td><div class="actions"><button class="btn" type="button" th:attr="data-id=${t.id},data-lang=${t.languageCode},data-name=${t.name},data-short=${t.shortDescription},data-full=${t.fullDescription},data-tts=${t.ttsScript},data-audio=${t.audioUrl},data-video=${t.videoUrl}" onclick="loadTranslation(this)"><i class="fa-solid fa-pen"></i> Sửa</button><button class="btn danger" type="button" th:attr="data-id=${t.id}" onclick="deleteTranslation(this)"><i class="fa-solid fa-trash"></i> Xóa</button></div></td></tr><tr th:if="${#lists.isEmpty(translations)}"><td colspan="5" style="color:var(--muted)">Chưa có bản dịch.</td></tr></tbody></table></section></main><script th:inline="javascript">const poiId=/*[[${poi.id}]]*/0;function loadTranslation(b){languageCode.value=b.dataset.lang||'';name.value=b.dataset.name||'';shortDescription.value=b.dataset.short||'';fullDescription.value=b.dataset.full||'';ttsScript.value=b.dataset.tts||'';audioUrl.value=b.dataset.audio||'';videoUrl.value=b.dataset.video||'';window.scrollTo({top:0,behavior:'smooth'});}async function deleteTranslation(b){if(!confirm('Xóa bản dịch này?'))return;const r=await fetch(`/admin/api/pois/${poiId}/translations/${b.dataset.id}`,{method:'DELETE'});if(r.ok)location.reload();else alert('Không thể xóa bản dịch.');}translationForm.addEventListener('submit',async e=>{e.preventDefault();const body={languageCode:languageCode.value.trim(),name:name.value.trim(),shortDescription:shortDescription.value,fullDescription:fullDescription.value,ttsScript:ttsScript.value,audioUrl:audioUrl.value,videoUrl:videoUrl.value,audioDuration:'0'};const r=await fetch(`/admin/api/pois/${poiId}/translations`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){msg.textContent='Đã lưu bản dịch.';setTimeout(()=>location.reload(),500)}else{msg.textContent='Lưu thất bại.';}});</script></body></html>
