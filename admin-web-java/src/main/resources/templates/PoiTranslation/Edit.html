<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sửa bản dịch POI - VERSA Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto}.subtitle,.page-subtitle,.card-subtitle{color:#aab5c8}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.page-title{font-size:28px;font-weight:800}.card{margin-top:20px;padding:28px;border:1px solid #28334a;border-radius:16px;background:#141c2d}.card-header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.card-title{font-size:18px;font-weight:700}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0}.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:9px;text-decoration:none;border:1px solid transparent;font-weight:700;cursor:pointer;font-size:14px}.btn-primary{background:#5b8cff;color:#fff}.btn-secondary{background:#1b2538;color:#dce5f3;border-color:#344158}.btn-danger{background:#7d2b3b;color:#fff}.btn-info{background:#3478c8;color:#fff}.btn-warning{background:#d69e2e;color:#111}.btn-sm{padding:8px 11px;font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form-group.full{grid-column:1/-1}.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px;font-weight:600}.form-control{width:100%;padding:12px 13px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:#fff;font:inherit}.form-control:focus{outline:2px solid #5b8cff55;border-color:#5b8cff}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.hint,.form-group small{display:block;color:#8d9ab0;font-size:12px;margin-top:7px}.table-wrapper{overflow:auto;border:1px solid #28334a;border-radius:16px;background:#141c2d}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:14px 16px;text-align:left;border-bottom:1px solid #28334a}.data-table th{color:#aab5c8;font-size:13px}.data-table td{color:#edf2fa}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#5b8cff;color:#fff;font-size:12px;font-weight:700}.empty-state{text-align:center;padding:35px;color:#aab5c8}.detail-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}.detail-list{display:grid;grid-template-columns:160px 1fr;gap:14px;margin:0}.detail-list dt{color:#8d9ab0}.detail-list dd{margin:0;color:#edf2fa;white-space:pre-wrap}.media-player{width:100%;max-width:520px;margin:8px 0 18px}.message{padding:12px;border-radius:9px;margin:12px 0}.success{background:#123c31;color:#8df0c0}.error{background:#451f2a;color:#ffabb6}.page-actions{display:flex;gap:10px;flex-wrap:wrap}.qr-preview{background:#fff;padding:18px;border-radius:14px;display:flex;justify-content:center;align-items:center;width:fit-content;margin:20px auto}.qr-preview canvas{max-width:100%}@media(max-width:700px){body{padding:18px}.form-grid,.detail-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.page-heading,.toolbar{flex-direction:column}.detail-list{grid-template-columns:1fr}.page-actions{width:100%}.page-actions .btn{flex:1;justify-content:center}}
</style></head>
<body><main class="wrap"><div class="page-title">Sửa bản dịch Điểm tham quan</div>
<div class="card">
<form id="editForm">
<input type="hidden" id="id" value="1"><input type="hidden" id="poiId" value="101"><input type="hidden" id="languageCode" value="vi">
<div class="form-grid">
<div class="form-group full"><label class="form-label">Tên địa điểm (Theo ngôn ngữ <strong id="langLabel">VI</strong>)</label><input id="name" class="form-control" type="text" value="Dinh Độc Lập" required></div>
<div class="form-group full"><label class="form-label">Mô tả ngắn</label><textarea id="shortDescription" class="form-control" rows="2">Di tích lịch sử nổi tiếng tại trung tâm Thành phố Hồ Chí Minh.</textarea></div>
<div class="form-group full"><label class="form-label">Mô tả chi tiết</label><textarea id="fullDescription" class="form-control" rows="5">Dinh Độc Lập là một địa danh lịch sử và điểm tham quan nổi bật.</textarea></div>
<div class="form-group full"><label class="form-label">File Audio (Thuyết minh)</label><audio controls src="" style="width:100%;max-width:400px;display:none" id="audioPreview"></audio><input class="form-control" type="file" id="audioFile" accept="audio/*"><small>Để trống nếu không muốn thay đổi file hiện tại.</small></div>
</div>
<div class="form-actions"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Cập nhật bản dịch</button><a href="Index.html" class="btn btn-secondary">Quay lại</a></div>
</form></div></main><script>
document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();alert('Đã cập nhật bản dịch (demo HTML).');});
document.getElementById('audioFile').addEventListener('change',e=>{const f=e.target.files[0],a=document.getElementById('audioPreview');if(f){a.src=URL.createObjectURL(f);a.style.display='block';}});
</script></body></html>
