<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sửa bản dịch Danh mục - VERSA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}
:root{--text:#f4f7fb;--muted:#a8b3c7;--line:rgba(148,163,184,.16);--panel:rgba(15,20,32,.94);--field:#151c2b;--blue:#5b8cff;--blue-hover:#3f72ed;--danger:#ff8b99}
body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(circle at 15% 10%,#183363,transparent 35%),radial-gradient(circle at 90% 90%,#30205d,transparent 32%),#080b12;color:var(--text);font-family:"Be Vietnam Pro",sans-serif}
.shell{width:min(980px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brand-icon{display:grid;width:46px;height:46px;flex:0 0 46px;place-items:center;border-radius:15px;background:linear-gradient(135deg,#5b8cff,#8b5cf6);box-shadow:0 14px 35px rgba(91,140,255,.28)}
.brand strong{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}
.page-heading{margin-bottom:22px}.page-title{margin:0 0 8px;font-size:clamp(25px,4vw,34px);font-weight:700;letter-spacing:-.04em}.page-subtitle{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
.card{padding:clamp(22px,4vw,32px);border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.28)}
.card-heading{display:flex;align-items:center;gap:12px;margin-bottom:25px}.heading-icon{display:grid;width:42px;height:42px;place-items:center;border-radius:13px;background:rgba(91,140,255,.13);color:var(--blue)}.card-heading h2{margin:0;font-size:17px}.card-heading p{margin:5px 0 0;color:var(--muted);font-size:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form-group{display:grid;align-content:start;gap:9px}.form-group.full{grid-column:1/-1}
.form-label{color:var(--muted);font-size:12px;font-weight:700}.required{color:var(--danger)}
.form-control{width:100%;min-height:45px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:0;background:var(--field);color:var(--text);font:inherit;font-size:13px;transition:border-color .2s,box-shadow .2s}
.form-control:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,140,255,.13)}.form-control:disabled{opacity:.65;cursor:not-allowed}.help-text{color:#748198;font-size:11px;line-height:1.6}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:43px;padding:0 18px;border:1px solid transparent;border-radius:12px;text-decoration:none;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-hover)}
.btn-secondary{border-color:var(--line);background:rgba(148,163,184,.08);color:#d7e2f5}.btn-secondary:hover{border-color:var(--blue);background:rgba(91,140,255,.12);color:#fff}
@media(max-width:640px){body{padding:18px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <span class="brand-icon"><i class="fa-solid fa-compass"></i></span>
    <div class="brand"><strong>VERSA Admin</strong><small>Cổng quản trị hệ thống</small></div>
  </header>

  <section class="page-heading">
    <h1 class="page-title">Sửa bản dịch Danh mục</h1>
    <p class="page-subtitle">Cập nhật nội dung ngôn ngữ <strong th:text="${categoryTranslation != null ? #strings.toUpperCase(categoryTranslation.languageCode) : ''}">VI</strong>.</p>
  </section>

  <section class="card">
    <div class="card-heading">
      <span class="heading-icon"><i class="fa-solid fa-language"></i></span>
      <div><h2>Thông tin bản dịch</h2><p>Chỉnh sửa tên danh mục theo ngôn ngữ đã chọn.</p></div>
    </div>

    <form th:action="@{edit}" method="post" th:object="${categoryTranslation}">
      <input type="hidden" th:field="*{id}">
      <input type="hidden" th:field="*{categoryId}">
      <input type="hidden" th:field="*{languageCode}">

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="languageCodeDisplay">Ngôn ngữ</label>
          <input class="form-control" id="languageCodeDisplay" type="text"
                 th:value="*{languageCode != null ? #strings.toUpperCase(languageCode) : ''}"
                 value="VI" disabled>
          <span class="help-text">Ngôn ngữ của bản dịch không thể thay đổi tại đây.</span>
        </div>

        <div class="form-group full">
          <label class="form-label" for="name">Tên Danh mục <span class="required">*</span></label>
          <input class="form-control" id="name" type="text" th:field="*{name}"
                 placeholder="Nhập tên danh mục" required maxlength="200">
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Cập nhật</button>
        <a class="btn btn-secondary"
           th:href="@{index(categoryId=${categoryTranslation.categoryId})}">
          <i class="fa-solid fa-arrow-left"></i> Quay lại
        </a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
