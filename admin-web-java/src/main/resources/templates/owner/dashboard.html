<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><style>body{margin:0;font-family:Arial;background:#f8fafc;color:#0f172a}.top{background:#0f766e;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1000px;margin:35px auto;padding:0 18px}.card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 18px #0f172a10;margin-bottom:18px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#fef3c7;color:#92400e;font-weight:700}.btn{border:0;background:white;color:#0f766e;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><header class="top"><strong>VERSA · OWNER</strong><form method="post" action="/auth/logout"><button class="btn">Đăng xuất</button></form></header><main class="wrap"><h1>Xin chào, <span th:text="${session.authUsername}">Owner</span></h1><div class="card" th:if="${profile != null}"><h2 th:text="${profile.businessName}">Cơ sở</h2><p>Người đại diện: <span th:text="${profile.representativeName ?: 'Chưa cập nhật'}">-</span></p><p>Email: <span th:text="${session.authEmail}">-</span></p><p>Trạng thái hồ sơ: <span class="badge" th:text="${profile.status}">Pending</span></p><p>Owner mới đăng ký sẽ chờ Admin duyệt trước khi được cấp quyền quản lý nghiệp vụ.</p></div><div class="card" th:if="${profile == null}"><p>Không tìm thấy hồ sơ Owner.</p></div><p><a href="/">← Về website</a></p></main></body></html>
