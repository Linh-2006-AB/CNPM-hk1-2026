@model AdminWeb.Models.Beacon

@{
    ViewData["Title"] = "Chỉnh sửa Beacon";
    var pois = ViewBag.Pois as IEnumerable<AdminWeb.Models.Poi>;
}

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chỉnh sửa Beacon #@Model.Id - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto}.subtitle{color:#aab5c8}.card{margin-top:24px;padding:28px;border:1px solid #28334a;border-radius:16px;background:#141c2d}.card h3{margin-top:0}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.form-group{margin:0}
.form-group.full{grid-column:span 2}
.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px;font-weight:600}
.form-control{width:100%;padding:13px 16px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white;font-size:14px}
.form-control:focus{outline:none;border-color:#5b8cff}
select.form-control{cursor:pointer}
.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:28px}
.btn{padding:12px 20px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn-secondary{background:#29364c;color:white}
.btn-secondary:hover{background:#34445c}
.btn-primary{background:#5b8cff;color:white}
.btn-primary:hover{background:#4a7be8}
</style>
</head>
<body>
<main class="wrap">
    <h1>Chỉnh sửa Beacon #@Model.Id</h1>
    <p class="subtitle">Cập nhật thông số thiết bị iBeacon.</p>

    <section class="card">
        <form asp-area="" asp-action="Edit" method="post">
            @Html.AntiForgeryToken()
            <input type="hidden" asp-for="Id" />
            
            <div class="form-grid">
                <!-- Điểm tham quan (POI) -->
                <div class="form-group full">
                    <label class="form-label">Điểm tham quan (POI) *</label>
                    <select class="form-control" asp-for="PoiId" required>
                        <option value="">-- Chọn điểm tham quan được gán --</option>
                        @if (pois != null) {
                            foreach (var poi in pois) {
                                var poiName = poi.Translations?.FirstOrDefault(t => t.LanguageCode == "vi")?.Name ?? $"POI #{poi.Id}";
                                <option value="@poi.Id">@poiName</option>
                            }
                        }
                    </select>
                </div>
                
                <!-- UUID -->
                <div class="form-group full">
                    <label class="form-label">UUID (Universally Unique Identifier) *</label>
                    <input class="form-control" asp-for="Uuid" type="text" required placeholder="VD: B9407F30-F5F8-466E-AFF9-25556B57FE6D" />
                </div>

                <!-- Major -->
                <div class="form-group">
                    <label class="form-label">Major *</label>
                    <input class="form-control" asp-for="Major" type="number" required />
                </div>

                <!-- Minor -->
                <div class="form-group">
                    <label class="form-label">Minor *</label>
                    <input class="form-control" asp-for="Minor" type="number" required />
                </div>

                <!-- Địa chỉ MAC -->
                <div class="form-group">
                    <label class="form-label">Địa chỉ MAC (Không bắt buộc)</label>
                    <input class="form-control" asp-for="MacAddress" type="text" placeholder="VD: 00:11:22:33:44:55" />
                </div>

                <!-- Ghi chú vị trí -->
                <div class="form-group">
                    <label class="form-label">Ghi chú vị trí đặt (Placement Note)</label>
                    <input class="form-control" asp-for="PlacementNote" type="text" placeholder="VD: Gắn trên tường phòng số 2" />
                </div>
            </div>

            <div class="actions">
                <a asp-area="" asp-action="Index" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Cập nhật
                </button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
