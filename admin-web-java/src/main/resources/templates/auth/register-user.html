<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký User</title><style>body{margin:0;font-family:Arial;background:#f1f5f9;min-height:100vh;display:grid;place-items:center}.box{width:min(500px,92vw);background:white;padding:30px;border-radius:16px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#0f766e;color:white;font-weight:700}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px}</style></head><body><main class="box"><h1>Đăng ký User / Du khách</h1><div th:if="${error}" class="err" th:text="${error}"></div><form method="post" action="/auth/register/user"><div class="field"><label>Họ tên</label><input name="fullName" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Mật khẩu</label><input name="password" type="password" required minlength="8"></div><div class="field"><label>Xác nhận mật khẩu</label><input name="confirmPassword" type="password" required minlength="8"></div><button class="btn">Tạo tài khoản User</button></form><p><a href="/auth/register">← Chọn loại khác</a></p></main></body></html>
