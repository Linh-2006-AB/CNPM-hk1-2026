<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký Owner</title><style>body{margin:0;font-family:Arial;background:#f1f5f9;min-height:100vh;display:grid;place-items:center}.box{width:min(600px,92vw);background:white;padding:30px;border-radius:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:8px 0}.field.full{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#ea580c;color:white;font-weight:700}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="box"><h1>Đăng ký Owner</h1><p>Hồ sơ Owner được tạo ở trạng thái <b>Pending</b> để Admin duyệt.</p><div th:if="${error}" class="err" th:text="${error}"></div><form method="post" action="/auth/register/owner"><div class="grid"><div class="field"><label>Username</label><input name="username" required minlength="3"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field full"><label>Tên cơ sở / gian hàng</label><input name="businessName" required></div><div class="field"><label>Người đại diện</label><input name="representativeName"></div><div class="field"><label>Số điện thoại</label><input name="phone"></div><div class="field full"><label>Địa chỉ</label><input name="address"></div><div class="field"><label>Mật khẩu</label><input name="password" type="password" required minlength="8"></div><div class="field"><label>Xác nhận mật khẩu</label><input name="confirmPassword" type="password" required minlength="8"></div></div><button class="btn">Tạo tài khoản Owner</button></form><p><a href="/auth/register">← Chọn loại khác</a></p></main></body></html>
