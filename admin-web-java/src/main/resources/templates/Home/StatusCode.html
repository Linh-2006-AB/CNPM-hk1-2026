<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Lỗi ' + ${code}">Lỗi - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto}
.card{margin-top:24px;padding:40px 28px;border:1px solid #28334a;border-radius:24px;background:#141c2d;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;margin-bottom:16px}
.badge.red{color:#ffabb6;background:rgba(69, 31, 42, 0.6);border:1px solid rgba(69, 31, 42, 0.9)}
.empty-state i{font-size:48px;color:#5b8cff;margin-bottom:16px;background:rgba(91, 140, 255, 0.1);width:80px;height:80px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(91, 140, 255, 0.2)}
.empty-state h2{margin:0 0 8px;font-size:24px;font-weight:800;color:#edf2fa}
.empty-state p{margin:0 0 24px;color:#aab5c8;font-size:14px;line-height:1.6;max-width:480px}
.page-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:14px}
.btn-primary{background:#5b8cff;color:white}
.btn-primary:hover{background:#4a7be8}
.btn-secondary{background:#29364c;color:white}
.btn-secondary:hover{background:#34445c}
</style>
</head>
<body>

<main class="wrap">
    <div class="card" style="max-width:760px; margin:8vh auto;">
        <div class="empty-state">
            <span class="badge red" th:text="${code != null ? code : '404'}">404</span>
            <i class="fa-solid fa-link-slash"></i>
            <h2>Không tìm thấy nội dung yêu cầu</h2>
            <p>Đường dẫn có thể đã thay đổi hoặc bạn không có quyền truy cập.</p>
            <div class="page-actions" style="margin-top:8px">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </button>
                <a th:href="@{/admin/dashboard}" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
