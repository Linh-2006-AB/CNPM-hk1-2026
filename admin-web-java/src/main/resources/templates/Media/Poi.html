<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media POI</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>:root{--bg:#0b1020;--surface:#141c2d;--surface2:#0e1524;--text:#edf2fa;--muted:#aab5c8;--border:#28334a;--accent:#5b8cff;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto}.heading{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.title{font-size:28px;font-weight:800}.muted{color:var(--muted);margin-top:7px}.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;font-weight:700;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{background:#8f2535;color:#fff}.card{margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}.form{display:grid;grid-template-columns:160px 1fr 120px auto;gap:10px}.form input,.form select{padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:#fff}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.item{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2)}.item img,.item video{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#fff}.url{word-break:break-all;color:#9ec1ff;font-size:12px;margin:8px 0}.empty{color:var(--muted)}@media(max-width:750px){.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="heading"><div><div class="title">Media POI #<span th:text="${poi.id}">1</span></div><div class="muted" th:text="${poi.name}">Tên POI</div></div><a href="/admin/pois" class="btn"><i class="fa-solid fa-arrow-left"></i> Quay lại POI</a></div><section class="card"><h3>Thêm media bằng URL</h3><form id="mediaForm" class="form"><select id="mediaType"><option value="image">image</option><option value="video">video</option><option value="audio">audio</option></select><input id="mediaUrl" placeholder="/uploads/... hoặc URL đầy đủ" required><input id="sortOrder" type="number" value="0"><button class="btn primary" type="submit">Thêm</button></form></section><section class="card"><h3>Media hiện có</h3><div class="media"><article class="item" th:each="m : ${mediaAssets}"><div th:switch="${m.mediaType}"><img th:case="'image'" th:src="${m.mediaUrl}" alt=""><video th:case="'video'" th:src="${m.mediaUrl}" controls></video><audio th:case="'audio'" th:src="${m.mediaUrl}" controls style="width:100%"></audio><div th:case="*" class="empty">Không hỗ trợ xem trực tiếp</div></div><div class="url" th:text="${m.mediaUrl}">url</div><button class="btn danger" type="button" th:attr="data-id=${m.id}" onclick="removeMedia(this)"><i class="fa-solid fa-trash"></i> Xóa</button></article><div class="empty" th:if="${#lists.isEmpty(mediaAssets)}">POI chưa có media.</div></div></section></main><script th:inline="javascript">const poiId=/*[[${poi.id}]]*/0;mediaForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(`/admin/api/pois/${poiId}/media`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mediaType:mediaType.value,mediaUrl:mediaUrl.value.trim(),sortOrder:Number(sortOrder.value||0)})});if(r.ok)location.reload();else alert('Không thể thêm media.');});async function removeMedia(b){if(!confirm('Xóa media này?'))return;const r=await fetch(`/admin/api/media/${b.dataset.id}`,{method:'DELETE'});if(r.ok)location.reload();else alert('Không thể xóa media.');}</script></body></html>
