<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện Media tổng hợp - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto}.subtitle{color:#aab5c8}
.page-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.media-layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
.card{border:1px solid #28334a;border-radius:16px;background:#141c2d;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
.card-header{padding:20px 24px;border-bottom:1px solid #28334a}
.card-title{margin:0;font-size:18px;font-weight:700;color:#edf2fa}
.card-body{padding:24px}
.form-group{margin-bottom:20px}
.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:13px;font-weight:600}
.form-control{width:100%;padding:12px 16px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white;font-size:14px}
.form-control:focus{outline:none;border-color:#5b8cff}
select.form-control{cursor:pointer}
input[type="file"].form-control{padding:10px;cursor:pointer}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.media-item{background:#0e1524;border:1px solid #28334a;border-radius:12px;overflow:hidden;position:relative}
.media-preview{width:100%;height:150px;object-fit:cover;display:block;background:#0b1020}
.media-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.75);color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.media-info{padding:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:14px}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-primary{background:#5b8cff;color:white}
.btn-primary:hover{background:#4a7be8}
.btn-secondary{background:#29364c;color:white}
.btn-secondary:hover{background:#34445c}
.btn-danger{background:#451f2a;color:#ffabb6;border:1px solid rgba(244,63,94,0.3)}
.btn-danger:hover{background:#542533}
@media (max-width:1024px){.media-layout{grid-template-columns:1fr}}
</style>
</head>
<body>

<main class="wrap">
    <div class="page-heading">
        <div>
            <h1 style="margin:0 0 8px; font-size:28px; font-weight:800;">Thư viện Media tổng hợp</h1>
            <p class="subtitle" style="margin:0;">Quản lý toàn bộ hình ảnh và video của tất cả Điểm tham quan.</p>
        </div>
    </div>

    <!-- Thanh công cụ lọc theo POI -->
    <div class="toolbar">
        <div>
            <form th:action="@{/admin/media/library}" method="get" style="display:flex; gap:10px; align-items:center;">
                <select name="poiId" class="form-control" style="width:280px; padding:10px 14px;" onchange="this.form.submit()">
                    <option value="">-- Tất cả Điểm tham quan --</option>
                    <th:block th:if="${pois != null}">
                        <option th:each="p : ${pois}" 
                                th:value="${p.id}" 
                                th:selected="${selectedPoiId == p.id}" 
                                th:text="${p.translations != null and not #lists.isEmpty(p.translations) ? p.translations.?[languageCode == 'vi'][0].name : 'POI #' + p.id}">
                            POI Name
                        </option>
                    </th:block>
                </select>
                <a th:if="${selectedPoiId != null}" th:href="@{/admin/media/library}" class="btn btn-secondary btn-sm" title="Xóa bộ lọc">
                    <i class="fa-solid fa-xmark"></i> Xóa lọc
                </a>
            </form>
        </div>
    </div>

    <div class="media-layout">
        <!-- Form Tải lên Media mới -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-cloud-arrow-up" style="color:#5b8cff; margin-right:8px;"></i> Tải lên Media mới</div>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/media/upload-media}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div class="form-group">
                        <label class="form-label">Chọn Điểm tham quan (POI) *</label>
                        <select class="form-control" name="poiId" required>
                            <option value="">-- Chọn POI --</option>
                            <th:block th:if="${pois != null}">
                                <option th:each="p : ${pois}" 
                                        th:value="${p.id}" 
                                        th:selected="${selectedPoiId == p.id}" 
                                        th:text="${p.translations != null and not #lists.isEmpty(p.translations) ? p.translations.?[languageCode == 'vi'][0].name : 'POI #' + p.id}">
                                    POI Name
                                </option>
                            </th:block>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Chọn file (Hình ảnh / Video) *</label>
                        <input class="form-control" type="file" name="mediaFile" accept="image/*,video/*" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Thứ tự hiển thị *</label>
                        <input class="form-control" type="number" name="sortOrder" value="0" required />
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                        <i class="fa-solid fa-upload"></i> Tải lên ngay
                    </button>
                </form>
            </div>
        </div>

        <!-- Danh sách Tất cả Media -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-photo-film" style="color:#5b8cff; margin-right:8px;"></i> Tất cả Media</div>
            </div>
            <div class="card-body">
                <div th:if="${mediaAssets != null and not #lists.isEmpty(mediaAssets)}">
                    <div class="media-grid">
                        <div th:each="media : ${mediaAssets}" class="media-item">
                            <!-- Hiển thị Video hoặc Ảnh -->
                            <div th:if="${media.mediaType == 'video'}" style="position:relative;">
                                <video th:src="${media.mediaUrl}" class="media-preview" controls></video>
                                <span class="media-badge"><i class="fa-solid fa-video" style="color:#38bdf8;"></i> Video</span>
                            </div>
                            <div th:unless="${media.mediaType == 'video'}" style="position:relative;">
                                <img th:src="${media.mediaUrl}" alt="Media POI" class="media-preview" />
                                <span class="media-badge"><i class="fa-solid fa-image" style="color:#8df0c0;"></i> Hình ảnh</span>
                            </div>

                            <div class="media-info">
                                <div style="font-size:13px; font-weight:bold; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#edf2fa;" 
                                     th:text="${media.poi != null and media.poi.translations != null and not #lists.isEmpty(media.poi.translations) ? media.poi.translations.?[languageCode == 'vi'][0].name : 'POI #' + media.poiId}">
                                    POI Name
                                </div>
                                
                                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #28334a; padding-top:8px; margin-top:6px;">
                                    <div style="font-size:12px; color:#aab5c8;">Thứ tự: <strong style="color:#edf2fa;" th:text="${media.sortOrder}">0</strong></div>
                                    
                                    <!-- Hiển thị nút xóa nếu user có quyền Admin -->
                                    <div th:if="${isAdmin}">
                                        <form th:action="@{/admin/media/delete-media}" method="post" style="margin:0;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa file này?');">
                                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <input type="hidden" name="id" th:value="${media.id}" />
                                            <button type="submit" class="btn btn-danger" style="padding:6px 10px; font-size:12px;" title="Xóa file">
                                                <i class="fa-solid fa-trash"></i> Xóa
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Trường hợp trống dữ liệu -->
                <div th:unless="${mediaAssets != null and not #lists.isEmpty(mediaAssets)}" style="text-align:center; padding:48px 20px; color:#aab5c8;">
                    <i class="fa-solid fa-photo-film" style="font-size:42px; margin-bottom:12px; opacity:0.4; color:#5b8cff;"></i>
                    <p style="margin:0; font-size:14px;">Chưa có media nào trong hệ thống.</p>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
