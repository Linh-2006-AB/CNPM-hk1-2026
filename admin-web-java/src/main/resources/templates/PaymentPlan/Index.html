<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gói dịch vụ - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto}.subtitle{color:#aab5c8}
.page-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.card{border:1px solid #28334a;border-radius:16px;background:#141c2d;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
.table-wrapper{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;text-align:left}
.data-table th{padding:14px 16px;background:#0e1524;color:#d5deec;font-size:13px;border-bottom:1px solid #28334a}
.data-table td{padding:14px 16px;border-bottom:1px solid #28334a;font-size:14px;color:#edf2fa;vertical-align:middle}
.data-table tr:hover td{background:rgba(91, 140, 255, 0.03)}
.badge{display:inline-block;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600}
.badge.green{background:rgba(18, 60, 49, 0.6);color:#8df0c0;border:1px solid rgba(18, 60, 49, 0.9)}
.badge.red{background:rgba(69, 31, 42, 0.6);color:#ffabb6;border:1px solid rgba(69, 31, 42, 0.9)}
.badge.blue{background:rgba(91,140,255,0.15);color:#5b8cff;border:1px solid rgba(91,140,255,0.3)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700;font-size:13px}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-primary{background:#5b8cff;color:white}
.btn-primary:hover{background:#4a7be8}
.btn-secondary{background:#29364c;color:white}
.btn-secondary:hover{background:#34445c}
</style>
</head>
<body>

<main class="wrap">
    <div class="page-heading">
        <div>
            <h1 style="margin:0 0 8px; font-size:28px; font-weight:800;">Gói dịch vụ</h1>
            <p class="subtitle" style="margin:0;">Thiết lập gói thu tiền cho chủ gian hàng và người dùng trong hệ thống.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/admin/payment-plans/create}" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Thêm gói dịch vụ
            </a>
        </div>
    </div>

    <!-- Khung Card bọc bảng danh sách -->
    <div class="card">
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 140px;">Mã gói</th>
                        <th>Tên gói & Mô tả</th>
                        <th style="width: 130px;">Đối tượng</th>
                        <th style="width: 140px;">Giá (VNĐ)</th>
                        <th style="width: 120px;">Thời hạn</th>
                        <th style="width: 120px;">Trạng thái</th>
                        <th style="text-align:center; width: 110px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${paymentPlans != null and not #lists.isEmpty(paymentPlans)}" th:each="plan : ${paymentPlans}">
                        <td>
                            <code style="background:#0e1524; padding:3px 8px; border-radius:6px; border:1px solid #344158; color:#8df0c0; font-family:monospace;" th:text="${plan.planCode}">PLAN01</code>
                        </td>
                        <td>
                            <strong style="color:#edf2fa; font-size:15px;" th:text="${plan.planName}">Tên gói</strong><br />
                            <small style="color:#aab5c8;" th:text="${plan.description}">Mô tả gói dịch vụ</small>
                        </td>
                        <td>
                            <span class="badge blue" th:text="${plan.audience}">Audience</span>
                        </td>
                        <td>
                            <strong style="color:#8df0c0;" th:text="${#numbers.formatDecimal(plan.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong>
                        </td>
                        <td>
                            <span style="color:#edf2fa;" th:text="${plan.durationDays} + ' ngày'">0 ngày</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${plan.isActive ? ' green' : ' red'}" 
                                  th:text="${plan.isActive ? 'Đang bật' : 'Đã tắt'}">Trạng thái</span>
                        </td>
                        <td style="text-align:center;">
                            <a th:href="@{/admin/payment-plans/edit/{id}(id=${plan.id})}" class="btn btn-sm btn-secondary" title="Chỉnh sửa gói">
                                <i class="fa-solid fa-pen"></i> Sửa
                            </a>
                        </td>
                    </tr>
                    <!-- Trường hợp danh sách trống -->
                    <tr th:if="${paymentPlans == null or #lists.isEmpty(paymentPlans)}">
                        <td colspan="7" style="text-align:center; padding:48px 20px; color:#aab5c8;">
                            Chưa có gói dịch vụ nào được thiết lập trong hệ thống.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
