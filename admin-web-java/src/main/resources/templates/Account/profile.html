<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ cá nhân - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto}.subtitle{color:#aab5c8}.card{margin-top:24px;padding:28px;border:1px solid #28334a;border-radius:16px;background:#141c2d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px}.input-wrap{position:relative}.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#aab5c8}.field input{width:100%;padding:13px 14px 13px 40px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white}.field input:disabled{opacity:.6}.hint{display:block;margin-top:7px;color:#8d9ab0;font-size:12px}.actions{display:flex;justify-content:flex-end;margin-top:24px}.submit{padding:12px 16px;border:0;border-radius:9px;background:#5b8cff;color:white;font-weight:700;cursor:pointer}.message{padding:12px;border-radius:9px;margin:12px 0}.error{background:#451f2a;color:#ffabb6}.success{background:#123c31;color:#8df0c0}@media(max-width:650px){body{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<main class="wrap">
<h1>Hồ sơ cá nhân</h1><p class="subtitle">Xem và cập nhật thông tin tài khoản của bạn.</p>
<section class="card">
<h3><i class="fa-solid fa-id-badge" style="color:#5b8cff"></i> Thông tin tài khoản</h3>
<p class="subtitle">Quản lý định danh và địa chỉ liên lạc của bạn.</p>
<div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<div class="message success" th:if="${successMessage}" th:text="${successMessage}"></div>
<form th:action="@{/account/profile}" method="post">
<div class="grid">
<div class="field"><label for="username">Tên đăng nhập</label><div class="input-wrap"><i class="fa-solid fa-user-shield"></i><input id="username" type="text" th:value="${account != null ? account.username : ''}" disabled></div><small class="hint">Tên đăng nhập không thể thay đổi.</small></div>
<div class="field"><label for="createdAt">Ngày tạo tài khoản</label><div class="input-wrap"><i class="fa-solid fa-calendar-days"></i><input id="createdAt" type="text" th:value="${account != null and account.createdAt != null ? #temporals.format(account.createdAt, 'dd/MM/yyyy HH:mm') : ''}" disabled></div></div>
<div class="field full"><label for="email">Email liên hệ *</label><div class="input-wrap"><i class="fa-solid fa-envelope"></i><input id="email" type="email" name="email" th:value="${account != null ? account.email : ''}" required></div></div>
</div>
<div class="actions"><button class="submit" type="submit"><i class="fa-solid fa-check"></i> Lưu thay đổi</button></div>
</form>
</section>
</main>
</body>
</html>
