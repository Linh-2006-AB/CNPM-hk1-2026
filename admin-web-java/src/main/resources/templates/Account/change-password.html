<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đổi mật khẩu - VERSA Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto}.subtitle{color:#aab5c8}.card{margin-top:24px;padding:28px;border:1px solid #28334a;border-radius:16px;background:#141c2d}.card h3{margin-top:0}.field{margin:20px 0}.field label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px}.input-wrap{position:relative}.input-wrap input{width:100%;padding:13px 45px 13px 40px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:white}.left-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#aab5c8}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:7px;background:transparent;color:white;border:0;cursor:pointer}.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}.btn,button.submit{padding:12px 16px;border:0;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:700}.btn{background:#29364c;color:white}.submit{background:#5b8cff;color:white}.message{padding:12px;border-radius:9px;margin:12px 0}.error{background:#451f2a;color:#ffabb6}.success{background:#123c31;color:#8df0c0}
</style>
</head>
<body>
<main class="wrap">
<h1>Đổi mật khẩu</h1><p class="subtitle">Cập nhật mật khẩu mới để bảo vệ tài khoản của bạn.</p>
<section class="card">
<h3><i class="fa-solid fa-shield-halved" style="color:#5b8cff"></i> Bảo mật</h3>
<p class="subtitle">Thiết lập mật khẩu mạnh để đảm bảo an toàn cho hệ thống.</p>
<div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<div class="message success" th:if="${successMessage}" th:text="${successMessage}"></div>
<form th:action="@{/account/change-password}" method="post">
<div class="field"><label for="oldPassword">Mật khẩu hiện tại *</label><div class="input-wrap"><i class="fa-solid fa-unlock-keyhole left-icon"></i><input type="password" id="oldPassword" name="oldPassword" autocomplete="current-password" required><button class="toggle" type="button" data-target="oldPassword"><i class="fa-solid fa-eye"></i></button></div></div>
<div class="field"><label for="newPassword">Mật khẩu mới *</label><div class="input-wrap"><i class="fa-solid fa-lock left-icon"></i><input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required><button class="toggle" type="button" data-target="newPassword"><i class="fa-solid fa-eye"></i></button></div></div>
<div class="field"><label for="confirmPassword">Xác nhận mật khẩu mới *</label><div class="input-wrap"><i class="fa-solid fa-check-double left-icon"></i><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required><button class="toggle" type="button" data-target="confirmPassword"><i class="fa-solid fa-eye"></i></button></div></div>
<div class="actions"><a class="btn" th:href="@{/account/profile}">Hủy bỏ</a><button class="submit" type="submit"><i class="fa-solid fa-key"></i> Đổi mật khẩu</button></div>
</form>
</section>
</main>
<script>
document.querySelectorAll('.toggle').forEach(button=>button.addEventListener('click',function(){
 const input=document.getElementById(this.dataset.target), icon=this.querySelector('i');
 const reveal=input.type==='password'; input.type=reveal?'text':'password';
 icon.classList.toggle('fa-eye',!reveal); icon.classList.toggle('fa-eye-slash',reveal);
}));
</script>
</body>
</html>
