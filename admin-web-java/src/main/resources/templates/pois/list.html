<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Địa điểm du lịch</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f8fa;color:#1f2937}header,main{max-width:1000px;margin:auto;padding:22px}header a{margin-right:16px;color:#0f766e}form{display:flex;gap:8px;margin:20px 0}input,button{padding:10px;border:1px solid #cbd5e1;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;padding:18px;border-radius:10px}.btn{display:inline-block;padding:9px;background:#0f766e;color:white;text-decoration:none;border-radius:6px}</style></head><body><header><a href="/">Trang chủ</a><a href="/tours">Tour du lịch</a></header><main><h1>Địa điểm du lịch</h1><form action="/pois" method="get"><input type="hidden" name="lang" th:value="${lang}"><input name="keyword" placeholder="Tìm địa điểm..." th:value="${keyword}"><button type="submit">Tìm kiếm</button></form><div class="grid" th:if="${pois != null and !pois.isEmpty()}"><article class="card" th:each="poi : ${pois}"><h2 th:text="${poi['name']}">Địa điểm</h2><p th:text="${poi['shortDescription']}"></p><a class="btn" th:href="@{/pois/{id}(id=${poi['id']},lang=${lang})}">Xem chi tiết</a></article></div><p th:if="${pois == null or pois.isEmpty()}">Không tìm thấy địa điểm phù hợp.</p></main></body></html>
