<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết địa điểm</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;color:#1f2937;line-height:1.6}a{color:#0f766e}.panel{background:#f8fafc;padding:20px;border-radius:10px}audio,video{max-width:100%}</style></head><body><p><a href="/pois">← Danh sách địa điểm</a></p><h1 th:text="${poi['name']}">Địa điểm</h1><section class="panel"><p th:text="${poi['shortDescription']}"></p><div th:utext="${poi['fullDescription']}"></div></section><h2>Thuyết minh</h2><audio controls th:if="${poi['audioUrl'] != null and !#strings.isEmpty(poi['audioUrl'])}" th:src="${poi['audioUrl']}"></audio><video controls th:if="${poi['videoUrl'] != null and !#strings.isEmpty(poi['videoUrl'])}" th:src="${poi['videoUrl']}"></video><div th:each="item : ${media}"><audio controls th:if="${#strings.toLowerCase(item['mediaType'].toString()).contains('audio')}" th:src="${item['mediaUrl']}"></audio><video controls th:if="${#strings.toLowerCase(item['mediaType'].toString()).contains('video')}" th:src="${item['mediaUrl']}"></video></div><h2>Đánh giá</h2><div th:each="review : ${reviews}" class="panel"><strong th:text="${'Đánh giá: ' + review['rating'] + '/5'}">Đánh giá</strong><p th:text="${review['comment']}"></p></div><p th:if="${reviews == null or reviews.isEmpty()}">Chưa có đánh giá.</p></body></html>
