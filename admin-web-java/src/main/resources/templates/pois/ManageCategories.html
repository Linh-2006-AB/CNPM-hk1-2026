<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phân loại danh mục - VERSA Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;padding:36px;background:#0b1020;color:#edf2fa;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto}.subtitle{color:#aab5c8}.card{margin-top:24px;padding:28px;border:1px solid #28334a;border-radius:16px;background:#141c2d}.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card-header{margin-bottom:18px}.card-title{font-size:18px;font-weight:700}.toolbar{display:flex;justify-content:flex-start;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border:0;border-radius:9px;text-decoration:none;font-weight:700;cursor:pointer;font-size:14px}.btn-sm{padding:8px 11px;font-size:13px}.btn-primary{background:#5b8cff;color:#fff}.btn-secondary{background:#27334a;color:#edf2fa}.btn-danger{background:#b83b50;color:#fff}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:12px 10px;text-align:left;border-bottom:1px solid #28334a}.data-table th{color:#aab5c8;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.badge.amber{background:#5a4320;color:#ffd78a}.form-group{margin-top:10px}.form-label{display:block;margin-bottom:8px;color:#d5deec;font-size:14px}.form-control{width:100%;padding:12px 13px;border:1px solid #344158;border-radius:10px;background:#0e1524;color:#fff;outline:none}.form-control:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.14)}select.form-control{appearance:auto}.message{padding:12px;border-radius:9px;margin:12px 0}.empty{color:#8d9ab0}.page-title{font-size:28px;font-weight:800}.page-subtitle{margin-top:8px;color:#aab5c8}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}@media(max-width:700px){body{padding:18px}.card-grid{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body><main class="wrap">
<div class="page-title">Phân loại danh mục - POI #1024</div><div class="page-subtitle">Gán điểm tham quan này vào các danh mục chủ đề phù hợp.</div>
<div class="toolbar"><a href="Index.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách POI</a></div>
<div class="card-grid">
<section class="card"><div class="card-header"><div class="card-title">Danh mục đã gán</div></div><div class="card-body"><table class="data-table"><thead><tr><th>Tên danh mục</th><th>Thao tác</th></tr></thead><tbody id="assignedCategories"></tbody></table><p id="emptyAssigned" class="empty" style="display:none">POI này chưa được thêm vào danh mục nào.</p></div></section>
<section class="card"><div class="card-header"><div class="card-title">Thêm vào danh mục mới</div></div><div class="card-body"><form id="addCategoryForm"><div class="form-group"><label class="form-label" for="categorySelect">Danh mục</label><select id="categorySelect" class="form-control" required><option value="">-- Chọn danh mục --</option><option value="1">Di tích lịch sử</option><option value="2">Văn hóa</option><option value="3">Kiến trúc</option><option value="4">Ẩm thực</option><option value="5">Điểm check-in</option></select></div><div class="actions"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Thêm danh mục</button></div></form></div></section>
</div></main><script>const assigned=new Map([[1,'Di tích lịch sử'],[3,'Kiến trúc']]);const select=document.getElementById('categorySelect');const tbody=document.getElementById('assignedCategories');const empty=document.getElementById('emptyAssigned');function render(){tbody.innerHTML='';assigned.forEach((name,id)=>{const tr=document.createElement('tr');tr.innerHTML=`<td><span class="badge amber">${name}</span></td><td><button class="btn btn-sm btn-danger" type="button" onclick="removeCategory(${id})">Gỡ bỏ</button></td>`;tbody.appendChild(tr)});empty.style.display=assigned.size?'none':'block'}function removeCategory(id){assigned.delete(id);render()}document.getElementById('addCategoryForm').addEventListener('submit',e=>{e.preventDefault();const id=Number(select.value);if(!id)return;if(assigned.has(id)){alert('Danh mục này đã được gán.');return}assigned.set(id,select.options[select.selectedIndex].text);select.value='';render()});render();</script></body></html>
