<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tour du lịch</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:30px auto;padding:0 18px;background:#f7f8fa;color:#1f2937}a{color:#0f766e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:white;padding:20px;border-radius:10px}.btn{display:inline-block;margin-top:10px;padding:9px 12px;background:#0f766e;color:#fff;text-decoration:none;border-radius:6px}</style></head><body><p><a href="/">← Trang chủ</a> · <a href="/pois">Địa điểm</a> · <a href="/about">Giới thiệu</a> · <a href="/contact">Liên hệ</a></p><h1>Tour du lịch</h1><div class="grid" th:if="${tours != null and !tours.isEmpty()}"><article class="card" th:each="tour : ${tours}"><h2 th:text="${tour['title']}">Tour</h2><p th:text="${tour['description']}"></p><small th:text="${tour['status']}"></small><br><a th:href="@{/tours(lang=${lang})}" class="btn">Xem danh sách tour</a></article></div><p th:if="${tours == null or tours.isEmpty()}">Chưa có tour du lịch.</p></body></html>
