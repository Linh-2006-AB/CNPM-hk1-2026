spring.application.name=admin-web-java
# ============================================
# CẤU HÌNH KẾT NỐI SQLITE
# ============================================
# Đường dẫn tới file CSDL SQLite he_thong_thuyet_minh.db
spring.datasource.url=jdbc:sqlite:App_Data/he_thong_thuyet_minh.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ============================================
# CẤU HÌNH JPA / HIBERNATE CHO SQLITE
# ============================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CẤU HÌNH JWT (Lấy từ appsettings.Production.json)
# ============================================
jwt.issuer=TourGuideSystem.AdminWeb
jwt.audience=TourGuideSystem.UserMobile
jwt.secret=VERSA-Production-Jwt-Signing-Key-Change-This-At-Least-32-Chars
jwt.expiration-days=30